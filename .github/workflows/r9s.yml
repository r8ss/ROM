name: Import PhotoRemasterService from ArtisanROM

on:
  workflow_dispatch: 

jobs:
  import-folder:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4
        with:
          ref: sixteen 

      - name: Grab the folder from ArtisanROM
        run: |
          echo "=> Cloning ArtisanROM sixteen branch..."
          # Shallow clone only the branch we need
          git clone --depth 1 --branch sixteen https://github.com/ArtisanROM/ArtisanROM.git temp_artisan
          
          # Check if the folder actually exists in the source to be sure
          if [ -d "temp_artisan/prebuilts/samsung/r9sxxx/system/priv-app/PhotoRemasterService" ]; then
            echo "=> Found the folder, preparing to move it..."
            
            # Create the target path in our repo
            mkdir -p prebuilts/samsung/r9sxxx/system/priv-app/
            
            # Delete the old one if it exists so we don't have merge conflicts
            rm -rf prebuilts/samsung/r9sxxx/system/priv-app/PhotoRemasterService
            
            # Copy the folder over
            cp -ar temp_artisan/prebuilts/samsung/r9sxxx/system/priv-app/PhotoRemasterService prebuilts/samsung/r9sxxx/system/priv-app/
            
            echo "=> Successfully copied. Current structure:"
            ls -R prebuilts/samsung/r9sxxx/system/priv-app/PhotoRemasterService
          else
            echo "Error: Source folder not found in ArtisanROM repo!"
            exit 1
          fi
          
          # Clean up the cloned source
          rm -rf temp_artisan

      - name: Push the changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add the files
          git add prebuilts/samsung/r9sxxx/system/priv-app/PhotoRemasterService
          
          # Check if there's actually a diff
          if ! git diff --cached --quiet; then
            echo "=> Changes detected, pushing..."
            git commit -m "prebuilts: fixup r9s (original author @Android-Artisan)"
            git push origin sixteen
          else
            echo "=> No changes found. Is the folder already there?"
          fi
