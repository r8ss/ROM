name: Build ExtremeROM

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
          - test

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        target: [d1xks]

    env:
      RELEASE_REPO: "ArtisanROM/rom_resources"
      GH_TOKEN: ${{ secrets.PAT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: compiler_cmake

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/extremerom_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/extremerom_platform.x509.pem

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Hotfix Samsung FUS Server (Samloader Rust Wrapper)
        run: |
          # 1. Télécharger le binaire Rust officiel précompilé pour Linux (v1.2.0)
          curl -Lo samloader.tar.xz https://github.com/topjohnwu/samloader-rs/releases/download/1.2.0/samloader-linux-x86_64.tar.xz
          tar -xf samloader.tar.xz
          sudo mv samloader /usr/local/bin/samloader-rs
          sudo chmod +x /usr/local/bin/samloader-rs

          # 2. Créer un wrapper de compatibilité pour traduire la syntaxe Python vers Rust
          sudo cat << 'EOF' > /usr/local/bin/samloader-compat
          #!/bin/bash
          MODEL=""
          REGION=""
          COMMAND=""
          OUT_DIR=""

          while [[ $# -gt 0 ]]; do
            case "$1" in
              -m|--model) MODEL="$2"; shift 2 ;;
              -r|--region) REGION="$2"; shift 2 ;;
              checkupdate|check-update) COMMAND="check-update"; shift ;;
              download) COMMAND="download"; shift ;;
              -O|-o|--out-dir|--out-file) OUT_DIR="$2"; shift 2 ;;
              *) shift ;;
            esac
          done

          if [ "$COMMAND" = "check-update" ]; then
            exec /usr/local/bin/samloader-rs check-update -m "$MODEL" -r "$REGION"
          elif [ "$COMMAND" = "download" ]; then
            if [ -n "$OUT_DIR" ]; then
              exec /usr/local/bin/samloader-rs download -m "$MODEL" -r "$REGION" -d "$OUT_DIR"
            else
              exec /usr/local/bin/samloader-rs download -m "$MODEL" -r "$REGION"
            fi
          fi
          EOF
          sudo chmod +x /usr/local/bin/samloader-compat

          # 3. Patcher dynamiquement les scripts pour contourner l'exécution de la version Python défaillante
          # La règle /pip install/! évite de casser les dépendances si pip cherche à télécharger le paquet d'origine
          find . -type f -name "*.sh" -exec sed -i '/pip install/!s/\bsamloader\b/samloader-compat/g' {} +
          find . -type f -name "*.sh" -exec sed -i 's/bin\/samloader/samloader-compat/g' {} +

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --force --ignore-target

      - name: Extract source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --force --ignore-target

      - name: Download target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --force --ignore-source

      - name: Extract target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --force --ignore-source

      - name: Add swapspace
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-space-path: /swapfile
          swap-size-gb: 12
          remove-existing-swap-files: true

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --force

      - name: Upload ROM to GoFile
        run: |
          # Find the exact flashable ZIP generated by the build script
          ROM_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)
          
          if [ -z "$ROM_FILE" ]; then
            echo "Error: Flashable ZIP not found!"
            exit 1
          fi

          echo "Found ROM ZIP: $ROM_FILE"
          echo "Uploading to GoFile..."
          
          RESPONSE=$(curl -s -F "file=@$ROM_FILE" \
            -F "token=${{ secrets.GOFILE_TOKEN }}" \
            -F "folderId=${{ secrets.GOFILE_FOLDER }}" \
            "https://upload-eu-par.gofile.io/uploadFile")
          
          echo "Uploaded successfully! Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'

